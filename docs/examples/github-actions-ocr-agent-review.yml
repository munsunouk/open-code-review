# Agent workflow CI example

This workflow exercises the deterministic host-agent path without an OCR LLM provider.

```yaml
name: ocr-agent-review
on:
  pull_request:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OCR
        run: go install github.com/open-code-review/open-code-review/cmd/opencodereview@latest

      - name: Prepare bundle
        run: |
          ocr agent prepare \
            --repo . \
            --from origin/${{ github.base_ref }} \
            --to HEAD \
            --output /tmp/bundle.json

      - name: Validate comments
        run: |
          ocr agent validate-comments \
            --repo . \
            --bundle /tmp/bundle.json \
            --comments ./fixtures/agent-comments.json \
            --output /tmp/validation.json

      - name: Render report
        run: |
          ocr agent report \
            --bundle /tmp/bundle.json \
            --comments ./fixtures/agent-comments.json \
            --validation /tmp/validation.json \
            --format markdown \
            --output /tmp/report.md
```

Replace `./fixtures/agent-comments.json` with comments produced by your host agent in production workflows.
