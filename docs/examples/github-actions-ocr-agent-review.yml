# Agent workflow CI example
#
# This workflow exercises the deterministic host-agent path without an OCR LLM provider.
# Replace the comments generation step with your host agent in production workflows.

name: ocr-agent-review
on:
  pull_request:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}"

      - name: Install OCR
        run: |
          mkdir -p "$(go env GOPATH)/bin"
          go build -o "$(go env GOPATH)/bin/ocr" ./cmd/opencodereview

      - name: Prepare bundle
        run: |
          ocr agent prepare \
            --repo . \
            --from "origin/${{ github.base_ref }}" \
            --to HEAD \
            --output /tmp/bundle.json

      - name: Build comments fixture
        run: |
          BUNDLE_ID="$(jq -r '.bundle_id' /tmp/bundle.json)"
          jq --arg bundle_id "$BUNDLE_ID" \
            '.bundle_id = $bundle_id' \
            fixtures/agent-comments.template.json > /tmp/comments.json

      - name: Validate comments
        run: |
          ocr agent validate-comments \
            --repo . \
            --bundle /tmp/bundle.json \
            --comments /tmp/comments.json \
            --output /tmp/validation.json

      - name: Render report
        run: |
          ocr agent report \
            --bundle /tmp/bundle.json \
            --comments /tmp/comments.json \
            --validation /tmp/validation.json \
            --format markdown \
            --output /tmp/report.md
